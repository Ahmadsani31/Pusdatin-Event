name: Deploy Laravel App to VPS

on:
  push:
    branches:
      - main   # atau ganti ke branch yang kamu pakai

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code dari GitHub
      - name: Checkout source code
        uses: actions/checkout@v3

      # Step 2: Setup PHP environment
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, curl, openssl, pdo, tokenizer, xml

      # Step 3: Install composer dependencies
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Step 4: Setup Node.js versi 22
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # Step 5: Install frontend dependencies
      - name: Install NPM dependencies
        run: npm ci

      # Step 6: Build frontend assets with Vite
      - name: Build assets using Vite
        run: npm run build

      # Step 7: Prepare SSH private key for connection
      - name: Prepare SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key
          chmod 600 private_key

      # Step 8: Deploy files to VPS using rsync over SSH
      - name: Deploy to VPS
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key
          chmod 600 private_key
          rsync -az --delete -e "ssh -i private_key -o StrictHostKeyChecking=no" ./ laravel-name@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}

      # Step 9: Run post-deploy commands (migrate, cache clear, dll)
      - name: Run Laravel commands on VPS
        run: |
          ssh -i private_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ${{ secrets.VPS_PATH }}
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
          EOF
